name: CI

# Compile et lance tous les tests à chaque push et à chaque Pull Request.
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compilation et tests
        run: mvn -B verify
