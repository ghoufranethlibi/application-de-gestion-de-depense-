spring.application.name=gestionnaire-depenses
server.port=${PORT:8080}

# Profil utilisé quand aucun n'est choisi : "dev" (démonstration locale).
# En production : SPRING_PROFILES_ACTIVE=prod et APP_ADMIN_PASSWORD obligatoire.
spring.profiles.default=dev

spring.datasource.url=jdbc:h2:file:./data/gestionnaire;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=true
spring.h2.console.enabled=false
server.error.include-message=never

# Compte administrateur créé au premier démarrage.
# Aucun mot de passe par défaut ici : sans APP_ADMIN_PASSWORD, l'application refuse de démarrer.
app.admin.email=${APP_ADMIN_EMAIL:admin@budget.local}
app.admin.mot-de-passe=${APP_ADMIN_PASSWORD:}
